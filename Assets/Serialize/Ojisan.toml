Name = "Ojisan"

# 出現人数 (Spawns を指定しない場合に、床からランダムに選ぶ)
Count = 3

# 歩き出すまでの待ちフレーム数の範囲 (60 = 約1秒)
MoveIntervalMin = 30
MoveIntervalMax = 120

# 出現位置を固定したい場合はコメントを外す (指定すると Count は無視される)
# Spawns = [{X = 3, Y = 0}, {X = 6, Y = 4}]

WalkTime = 16

# アニメーションタグ
U = "backward"
D = "forward"
L = "left"
R = "right"

# X, Y は使わない (出現位置は Spawns / ランダム)。Layer のみ有効
[Position]
X = 0
Y = 0
Layer = "Human"

# 絵が届くまで仮に主人公の絵を使う。届いたら JsonPath / PngPath を差し替える
[TileData]
Name = "Ojisan"
JsonPath = "みんげー主人公走るアニメーション前後左右.json"
PngPath = "みんげー主人公走るアニメーション前後左右-Sheet.png"
Offset = {X = 0, Y = -7}
