# 路線図（行き先選択画面）の定義
# 座標は Width x Height の基準サイズ上の値。画面サイズに合わせて拡大縮小して描画される。
# 絵が届いたら Width / Height を絵のサイズにし、各駅の座標を絵に合わせる。
# 上下左右キーでの移動先は、Lines でつながった駅の位置関係から自動で決まる。
# 自動で決まるキーを変えたい路線は、Lines に FromKey / ToKey（Left / Right / Up / Down）を書く。
#   FromKey: From の駅で To へ進むキー / ToKey: To の駅で From へ戻るキー
#   例: [[Lines]] From = "Departure" To = "Red" FromKey = "Left" ToKey = "Right"
# 書いた向きは明示が優先され、書かない向きは自動のまま。
# Minutes: その路線の所要時間（分）。省略すると 0。
Width = 320
Height = 240

[Stations.Departure]
Label = "自宅"
X = 84
Y = 205

[Stations.Blue]
Label = "Blue"
X = 109
Y = 120

[Stations.Red]
Label = "Red"
X = 226
Y = 147

[Stations.Orange]
Label = "Orange"
X = 51
Y = 57

[Stations.Purple]
Label = "Purple"
X = 274
Y = 99

[Stations.Green]
Label = "Green"
X = 166
Y = 66

[[Lines]]
From = "Departure"
To = "Blue"
FromKey = "Up"
ToKey = "Down"
Minutes = 10

[[Lines]]
From = "Departure"
To = "Red"
FromKey = "Right"
ToKey = "Down"
Minutes = 20

[[Lines]]
From = "Blue"
To = "Red"
Minutes = 15

[[Lines]]
From = "Blue"
To = "Orange"
Minutes = 10

[[Lines]]
From = "Red"
To = "Purple"
Minutes = 10

[[Lines]]
From = "Orange"
To = "Green"
Minutes = 15

[[Lines]]
From = "Purple"
To = "Green"
Minutes = 15
